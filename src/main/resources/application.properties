# ==========================================================
# Application Configuration - Spring Boot Quiz App
# ==========================================================
server.port=8080

# ----------------------------------------------------------
# Default Database: In-Memory H2 (Runs with ZERO setup)
# ----------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:quizdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Enable H2 Web Console (Access at: http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ----------------------------------------------------------
# Optional: MySQL Configuration
# To use MySQL instead of H2, comment the H2 section above
# and uncomment the lines below:
# ----------------------------------------------------------
# spring.datasource.url=jdbc:mysql://localhost:3306/quiz_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=your_password
# spring.jpa.hibernate.ddl-auto=update
# spring.sql.init.mode=always