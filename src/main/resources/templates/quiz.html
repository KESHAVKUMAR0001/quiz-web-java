<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Take Quiz - Java Quiz Pro</title>
    <div th:replace="~{navbar :: headerfiles}"></div>
</head>
<body>

    <!-- Navbar Fragment -->
    <div th:replace="~{navbar :: navbar}"></div>

    <main class="main-wrapper">
        <div class="container py-4">
            
            <!-- Quiz Info Banner -->
            <div class="quiz-card p-4 mb-4">
                <div class="row align-items-center g-3">
                    <div class="col-md-6">
                        <div class="d-flex align-items-center gap-3">
                            <div class="p-3 rounded-circle bg-primary bg-opacity-25 text-primary fs-3">
                                <i class="bi bi-person-circle"></i>
                            </div>
                            <div>
                                <h5 class="text-white mb-0" th:text="${quizForm.username}">Student</h5>
                                <small class="text-muted">Candidate Session Active</small>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6 text-md-end">
                        <span class="badge badge-pill-soft fs-6">
                            <i class="bi bi-ui-checks me-1"></i> Total: <span th:text="${totalQuestions}">5</span> Questions
                        </span>
                    </div>
                </div>
            </div>

            <!-- Quiz Form -->
            <form th:action="@{/submit}" method="POST" th:object="${quizForm}">
                <input type="hidden" th:field="*{username}" />

                <div th:each="ques, iter : ${quizForm.questions}" class="quiz-card p-4 p-md-5 mb-4">
                    
                    <div class="d-flex align-items-center justify-content-between mb-3">
                        <span class="badge badge-pill-soft" th:text="'Question ' + ${iter.count} + ' of ' + ${totalQuestions}">Question 1</span>
                        <small class="text-muted"><i class="bi bi-circle-fill text-warning me-1" style="font-size: 8px;"></i> Select 1 option</small>
                    </div>

                    <h4 class="text-white mb-4 fw-semibold" th:text="${ques.title}">Question text</h4>

                    <input type="hidden" th:name="|questions[${iter.index}].id|" th:value="${ques.id}" />
                    <input type="hidden" th:name="|questions[${iter.index}].title|" th:value="${ques.title}" />

                    <!-- Options Grid -->
                    <div class="row g-3">
                        <!-- Option A -->
                        <div class="col-md-6">
                            <input type="radio" class="option-radio" th:id="|q_${iter.index}_optA|" th:name="|questions[${iter.index}].selectedOption|" value="1" />
                            <label class="option-label" th:for="|q_${iter.index}_optA|">
                                <span class="option-badge">A</span>
                                <span class="option-text" th:text="${ques.optionA}">Option A</span>
                            </label>
                        </div>

                        <!-- Option B -->
                        <div class="col-md-6">
                            <input type="radio" class="option-radio" th:id="|q_${iter.index}_optB|" th:name="|questions[${iter.index}].selectedOption|" value="2" />
                            <label class="option-label" th:for="|q_${iter.index}_optB|">
                                <span class="option-badge">B</span>
                                <span class="option-text" th:text="${ques.optionB}">Option B</span>
                            </label>
                        </div>

                        <!-- Option C -->
                        <div class="col-md-6">
                            <input type="radio" class="option-radio" th:id="|q_${iter.index}_optC|" th:name="|questions[${iter.index}].selectedOption|" value="3" />
                            <label class="option-label" th:for="|q_${iter.index}_optC|">
                                <span class="option-badge">C</span>
                                <span class="option-text" th:text="${ques.optionC}">Option C</span>
                            </label>
                        </div>

                        <!-- Option D -->
                        <div class="col-md-6">
                            <input type="radio" class="option-radio" th:id="|q_${iter.index}_optD|" th:name="|questions[${iter.index}].selectedOption|" value="4" />
                            <label class="option-label" th:for="|q_${iter.index}_optD|">
                                <span class="option-badge">D</span>
                                <span class="option-text" th:text="${ques.optionD}">Option D</span>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Submit Action -->
                <div class="text-center mt-5 mb-4">
                    <button type="submit" class="btn btn-primary-custom px-5 py-3 fs-5 d-inline-flex align-items-center gap-2">
                        <i class="bi bi-send-check-fill"></i>
                        <span>Submit Final Answers</span>
                    </button>
                    <div class="mt-2 text-muted small">Once submitted, your answers will be evaluated and logged to the leaderboard.</div>
                </div>
            </form>

        </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{footer :: footer}"></div>

    <!-- Bootstrap 5.3 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
